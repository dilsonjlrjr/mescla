version: '3'

info:
  companyName: "Paint Match AI"
  productName: "Paint Match AI"
  productIdentifier: "com.paintmatchai.app"
  description: "Ferramenta profissional para pintores de miniaturas"
  copyright: "(c) 2025 Paint Match AI"
  comments: "Base de conhecimento de tintas para modelismo"
  version: "1.0.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - dist
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
