# Serve o PWA Mescla (arquivos estáticos). nginx:alpine já mapeia .wasm como
# application/wasm. O service worker e o index nunca ficam em cache, pra o app
# atualizar assim que um novo build é publicado.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Rotas via History API (nav.svelte.ts) caem no index.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # catalog.json (~736 KB) e wasm comprimem bem no transporte.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;
}
