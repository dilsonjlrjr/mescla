# Serve o PWA Mescla (arquivos estáticos) e encaminha /api/ pro mescla-api
# (serviço `api` do compose, fasthttp). O service worker e o index nunca ficam
# em cache, pra o app atualizar assim que um novo build é publicado.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Rotas via History API (nav.svelte.ts) caem no index.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # mescla-api — front chama sempre "/api/...", nunca uma URL absoluta
    # (front/vite.config.ts faz o mesmo em dev). Barra final em ambos:
    # strip do prefixo /api antes de repassar ao servidor upstream.
    location /api/ {
        # O plano viaja com as fotos em base64: até 10 abas de 2 MB (rf-09).
        # O default do nginx é 1 MB e cortaria com 413 antes de a API ver o
        # corpo — o MaxRequestBodySize de 32 MB do fasthttp não adianta
        # sozinho. Os dois tetos precisam bater.
        client_max_body_size 32m;
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
