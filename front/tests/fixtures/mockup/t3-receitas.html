<sc-if value="{{ isReceitas }}" hint-placeholder-val="{{ false }}">
    <div data-screen-label="Receitas" style="display: flex; flex-direction: column; height: 100%;">
      <div style="display: flex; align-items: center; flex-wrap: wrap; row-gap: 8px; gap: 16px; min-height: 76px; flex-shrink: 0; padding: 10px 20px; border-bottom: 1px solid #2b2e3c;">
        <button sc-camel-on-click="{{ goPergunta }}" style="display: inline-flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px 0 12px; border: 1px solid #3f424d; border-radius: 8px; background: transparent; color: #b2b6ca; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer;" style-hover="border-color: #5d5294; color: #b5abfc;">
          <i class="ph ph-arrow-left" style="font-size: 19px;"></i>{{ question }}
        </button>
        <svg sc-camel-view-box="0 0 48 48" width="26" height="26" aria-hidden="true" style="flex-shrink: 0;">
          <polygon points="24,2 43,13 43,35 24,46 5,35 5,13" fill="#75798c"></polygon>
          <polygon points="5,13 11,15 24,36 24,46 5,35" fill="#5f6373"></polygon>
          <polygon points="43,13 37,15 24,36 24,46 43,35" fill="#9184d9"></polygon>
          <polygon points="24,2 5,13 11,15" fill="#6b6f80"></polygon>
          <polygon points="24,2 43,13 37,15" fill="#7d6fca"></polygon>
          <polygon points="24,2 11,15 37,15" fill="#8b8fa3"></polygon>
          <polygon points="11,15 37,15 24,36" fill="#d2cefd"></polygon>
        </svg>
        <div style="display: flex; flex-direction: column;">
          <span style="font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #9397ab;">{{ savedRecipes }}</span>
          <span style="font-size: clamp(16px, 1.8cqi, 21px); font-weight: 500; letter-spacing: -0.01em;">{{ recipeCount }}</span>
        </div>
        <span style="flex: 1;"></span>
        <button sc-camel-on-click="{{ goPlano }}" style="display: inline-flex; align-items: center; gap: 10px; height: 52px; padding: 0 18px; border: 1px solid #3f424d; border-radius: 8px; background: transparent; color: #b2b6ca; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer;" style-hover="border-color: #5d5294; color: #b5abfc;">
          <i class="ph ph-crosshair" style="font-size: 18px;"></i>{{ navPlano }}
        </button>
        <div style="display: flex; gap: 3px; flex-shrink: 0; padding: 3px; border: 1px solid #3f424d; border-radius: 8px;">
          <sc-for list="{{ langs }}" as="l" hint-placeholder-count="4">
            <button sc-camel-on-click="{{ l.pick }}" aria-label="{{ l.label }}" title="{{ l.label }}" style="min-width: 44px; height: 40px; padding: 0 6px; border: none; border-radius: 6px; background: {{ l.bg }}; color: {{ l.fg }}; font-family: inherit; font-size: 12.5px; font-weight: 500; letter-spacing: 0.04em; cursor: pointer;" style-hover="color: #d2cefd;">{{ l.code }}</button>
          </sc-for>
        </div>
      </div>

      <div style="flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 34%) minmax(0, 1fr);">
        <div style="min-height: 0; overflow-y: auto; padding: 20px; border-right: 1px solid #2b2e3c; display: flex; flex-direction: column; gap: 10px;">
          <sc-for list="{{ recipeList }}" as="r" hint-placeholder-count="5">
            <button sc-camel-on-click="{{ r.pick }}" style="display: flex; align-items: center; gap: 16px; padding: 16px; border: 1px solid {{ r.border }}; border-radius: 14px; background: {{ r.bg }}; text-align: left; cursor: pointer; font-family: inherit;" style-hover="border-color: #5d5294;">
              <span style="display: flex; border-radius: 4px; overflow: hidden; border: 1px solid #3f424d; flex-shrink: 0;">
                <span style="width: 30px; height: 54px; background: {{ r.target }};"></span>
                <span style="width: 30px; height: 54px; background: {{ r.result }};"></span>
              </span>
              <span style="display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0;">
                <span style="font-size: 16px; font-weight: 500; color: #e9e9ed; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ r.name }}</span>
                <span style="font-size: 13px; color: #9397ab;">{{ r.meta }}</span>
              </span>
              <span style="font-size: 14px; color: #b2b6ca; flex-shrink: 0;">{{ r.delta }}</span>
            </button>
          </sc-for>
        </div>

        <div style="min-height: 0; overflow-y: auto; padding: 24px;">
          <p style="margin: 0; font-size: 12px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: #9397ab;">{{ reproduceIn }}</p>
          <div style="display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 22px;">
            <sc-for list="{{ recipeBrands }}" as="b" hint-placeholder-count="5">
              <button sc-camel-on-click="{{ b.pick }}" style="height: 48px; padding: 0 12px; border: 1px solid {{ b.border }}; border-radius: 8px; background: {{ b.bg }}; color: {{ b.fg }}; font-family: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer; flex-shrink: 0; white-space: nowrap;" style-hover="border-color: #5d5294;">{{ b.name }}</button>
            </sc-for>
          </div>

          <h2 style="margin: 0; font-size: clamp(19px, 2.4cqi, 28px); font-weight: 500; letter-spacing: -0.02em; line-height: 1.14; color: #e9e9ed; text-wrap: pretty;">{{ recipeHeadline }}</h2>
          <p style="margin: 10px 0 0; font-size: 16px; color: #b2b6ca; text-wrap: pretty;">{{ recipeConsequence }}</p>

          <div style="display: flex; align-items: center; gap: 20px; margin: 20px 0 24px; padding: 16px 18px; border: 1px solid #2e3140; border-radius: 14px; background: #1b1d29;">
            <span style="display: flex; border-radius: 8px; overflow: hidden; border: 1px solid #3f424d; flex-shrink: 0;">
              <span style="width: 62px; height: 72px; background: {{ recipeTarget }};"></span>
              <span style="width: 62px; height: 72px; background: {{ recipeResult }};"></span>
            </span>
            <span style="display: flex; align-items: baseline; gap: 8px;">
              <span style="font-size: clamp(28px, 3.4cqi, 40px); font-weight: 500; line-height: 1; letter-spacing: -0.03em; color: {{ recipeDeltaFg }};">{{ recipeDelta }}</span>
              <span style="font-size: 14px; color: #9397ab;">ΔE00</span>
            </span>
            <span style="font-size: 16px; font-weight: 500; color: #e9e9ed;">{{ recipeVerdict }}</span>
          </div>

          <div style="display: flex; flex-direction: column; gap: 10px;">
            <sc-for list="{{ recipeSteps }}" as="st" hint-placeholder-count="3">
              <div style="display: flex; align-items: center; gap: 16px; min-height: 84px; padding: 12px 18px; border: 1px solid #2e3140; border-radius: 14px; background: #1b1d29;">
                <svg sc-camel-view-box="0 0 60 100" width="40" height="67" aria-hidden="true" style="flex-shrink: 0;">
                  <path d="M25 4 L35 4 L38 18 L22 18 Z" fill="#595d6c"></path>
                  <rect x="19" y="17" width="22" height="9" rx="3" fill="#75798c"></rect>
                  <rect x="11" y="26" width="38" height="70" rx="10" fill="{{ st.hex }}" stroke="#0f1017" stroke-width="2"></rect>
                  <rect x="19" y="56" width="22" height="20" rx="2" fill="#e9e9ed"></rect>
                  <rect x="24" y="61" width="12" height="10" rx="1.5" fill="{{ st.hex }}"></rect>
                </svg>
                <span style="display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0;">
                  <span style="font-size: 18px; font-weight: 500; color: #e9e9ed; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ st.name }}</span>
                  <span style="font-size: 13px; color: #9397ab;">{{ st.meta }}</span>
                </span>
                <span style="font-size: 24px; font-weight: 500; color: #e9e9ed; flex-shrink: 0;">{{ st.amount }}</span>
                <span style="width: 54px; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #9397ab; flex-shrink: 0;">{{ st.unitLabel }}</span>
              </div>
            </sc-for>
          </div>

          <p style="margin: 26px 0 12px; font-size: 12px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: #9397ab;">{{ sameOtherBrands }}</p>
          <div style="display: flex; flex-direction: column;">
            <sc-for list="{{ recipeElsewhere }}" as="e" hint-placeholder-count="4">
              <button sc-camel-on-click="{{ e.pick }}" style="display: flex; align-items: center; gap: 16px; min-height: 62px; padding: 10px 4px; border: none; border-bottom: 1px solid #2b2e3c; background: transparent; text-align: left; cursor: pointer; font-family: inherit;" style-hover="background: #1b1d29;">
                <span style="width: 44px; height: 34px; border-radius: 4px; border: 1px solid #3f424d; background: {{ e.hex }}; flex-shrink: 0;"></span>
                <span style="display: flex; flex-direction: column; flex: 1; min-width: 0;">
                  <span style="font-size: 16px; font-weight: 500; color: #e9e9ed;">{{ e.brand }}</span>
                  <span style="font-size: 13px; color: #9397ab; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ e.paint }}</span>
                </span>
                <span style="font-size: 14px; color: {{ e.color }}; flex-shrink: 0;">{{ e.delta }}</span>
              </button>
            </sc-for>
          </div>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ sheetOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; z-index: 60; display: flex; justify-content: flex-end;">
      <div sc-camel-on-click="{{ closeSheet }}" style="position: absolute; inset: 0; background: rgba(9,10,16,0.66);"></div>
      <div style="position: relative; width: min(496px, 92%); height: 100%; border-left: 1px solid #3f424d; background: #1a1c27; display: flex; flex-direction: column; box-shadow: -24px 0 60px rgba(0,0,0,0.5);">
        <div style="display: flex; align-items: center; gap: 14px; height: 76px; min-height: 76px; flex-shrink: 0; padding: 0 20px; border-bottom: 1px solid #2b2e3c;">
          <span style="flex: 1; font-size: 22px; font-weight: 500; letter-spacing: -0.01em;">{{ sheetTitle }}</span>
          <button sc-camel-on-click="{{ closeSheet }}" style="display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border: 1px solid #3f424d; border-radius: 8px; background: transparent; color: #b2b6ca; cursor: pointer;" style-hover="border-color: #5d5294; color: #b5abfc;">
            <i class="ph ph-x" style="font-size: 20px;"></i>
          </button>
        </div>

        <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 20px 24px 32px;">

          <sc-if value="{{ sheetIsCatalogo }}" hint-placeholder-val="{{ false }}">
            <div>
              <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px;">
                <sc-for list="{{ brandChips }}" as="c" hint-placeholder-count="6">
                  <button sc-camel-on-click="{{ c.pick }}" style="height: 44px; padding: 0 14px; border: 1px solid {{ c.border }}; border-radius: 999px; background: {{ c.bg }}; color: {{ c.fg }}; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer;">{{ c.name }}</button>
                </sc-for>
              </div>
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px;">
                <sc-for list="{{ catalogItems }}" as="p" hint-placeholder-count="12">
                  <button sc-camel-on-click="{{ p.pick }}" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 8px; border: 1px solid #2e3140; border-radius: 14px; background: #1e2029; cursor: pointer; font-family: inherit;" style-hover="border-color: #5d5294;">
                    <svg sc-camel-view-box="0 0 60 100" width="44" height="74" aria-hidden="true">
                      <path d="M25 4 L35 4 L38 18 L22 18 Z" fill="#595d6c"></path>
                      <rect x="19" y="17" width="22" height="9" rx="3" fill="#75798c"></rect>
                      <rect x="11" y="26" width="38" height="70" rx="10" fill="{{ p.hex }}" stroke="#0f1017" stroke-width="2"></rect>
                      <rect x="19" y="56" width="22" height="20" rx="2" fill="#e9e9ed"></rect>
                      <rect x="24" y="61" width="12" height="10" rx="1.5" fill="{{ p.hex }}"></rect>
                    </svg>
                    <span style="font-size: 12.5px; font-weight: 500; color: #e9e9ed; text-align: center; line-height: 1.3;">{{ p.name }}</span>
                    <span style="font-size: 11.5px; color: #9397ab;">{{ p.code }}</span>
                  </button>
                </sc-for>
              </div>
            </div>
          </sc-if>

        </div>
      </div>
    </div>
  </sc-if>
</div>

</x-dc>



</body></html>
